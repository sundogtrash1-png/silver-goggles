; ============================================================================
;  Gender Matters DLL - settings
;  Place at: Data/SKSE/Plugins/GenderMattersDLL.ini
;
;  All defaults below are the ORIGINAL mod's real shipped values, pulled
;  directly out of gender_matters.esp - nothing here is guessed. Change any
;  number and it takes effect next time you load a save or start a new game.
; ============================================================================

; ----------------------------------------------------------------------------
; Master switches - matches the mod's original GM_* global toggles.
; ----------------------------------------------------------------------------
bEnabled=1              ; master on/off switch for everything below
bHardcore=0             ; 1 = use the *Hardcore variants of the multipliers
bApplyToPlayer=1        ; apply effects to the player if female
bApplyToNPCs=1          ; apply effects to female NPCs

bInflictLessMelee=1     ; melee damage dealt penalty
bTakeMoreDmg=1          ; incoming damage penalty
bRangedNerf=1           ; disables the vanilla "quickdraw" bow-speed perk
bGetStaggeredMore=1     ; incoming stagger penalty
bBlockLessDmg=1         ; block effectiveness penalty
bAffectsSkills=1        ; intimidation swing + speech/alchemy bonus
bSneakBetter=1          ; sneak skill + quieter footsteps
bLessCarry=1            ; carry weight penalty
bMagicResistMalus=1     ; magic resistance penalty
bSmithingMalus=0        ; off by default, same as the source mod

; ----------------------------------------------------------------------------
; Percent multipliers - 1.0 = no change. Below 1.0 = less/weaker,
; above 1.0 = more/stronger. These feed Bethesda's native combat perk
; entry points directly, so they interact correctly with armor, other
; mods' damage perks, difficulty settings, etc.
; ----------------------------------------------------------------------------
fMeleeDamageDealtMult=0.85
fMeleeDamageDealtMultHardcore=0.70

fIncomingDamageMult=1.15
fIncomingDamageMultHardcore=1.30

fIncomingStaggerMult=1.20
fIncomingStaggerMultHardcore=1.30

fBlockEffectivenessMult=0.85
fBlockEffectivenessMultHardcore=0.75

; Intimidation swings both ways depending on a weapon-skill check in the
; original perk: "HighSkill" is the threatening/skilled branch.
fIntimidationMultHighSkill=1.25
fIntimidationMultLowSkill=0.75

; ----------------------------------------------------------------------------
; Flat actor-value bonuses/penalties (skill points, NOT percentages).
; carryWeight and magicResist match the exact numbers found in the source
; ESP. The other four (sneak/speech/alchemy/smithing) were driven by a
; Papyrus script in the original that couldn't be recovered from static
; data, so these are reasonable starting points - tune to taste.
; ----------------------------------------------------------------------------
fCarryWeightFlat=-50
fMagicResistFlat=-15
fMagicResistFlatHardcore=-30
fSneakBonusFlat=15
fSpeechBonusFlat=10
fAlchemyBonusFlat=10
fSmithingMalusFlat=-10
