name: Build GenderMattersDLL

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up vcpkg (fetches CommonLibSSE-NG)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ''

      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Upload the compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: GenderMattersDLL
          path: build/Data/**
